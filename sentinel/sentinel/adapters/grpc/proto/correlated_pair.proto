syntax = "proto3";

package sentinel;

// One input stream's capture, contributed to a correlated pair.
message InputCaptureProto {
  string name = 1;
  bytes body = 2;              // JSON-encoded dict
  int64 received_at_ms = 3;
  int32 size_bytes = 4;
}

// Message published to SQS by a CorrelationEngine after all N inputs + output are matched.
// Consumed by the Agent, which uses it as the sole input for detection and training.
message CorrelatedPairProto {
  string engine_name = 1;
  string correlation_id = 2;
  repeated InputCaptureProto inputs = 3;
  bytes output_body = 4;       // JSON-encoded dict
  int64 output_received_at_ms = 5;
  int32 output_size_bytes = 6;
  float processing_latency_ms = 7;
  bool timed_out = 8;          // true when not all inputs arrived before output
}
