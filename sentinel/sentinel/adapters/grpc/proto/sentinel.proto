syntax = "proto3";

package sentinel;

service SentinelCortex {
  // Agent → TemporalLayer / Cortex
  rpc ReportEvent(ProcessedEventProto) returns (Ack);
  rpc ReportHeartbeat(HeartbeatProto) returns (Ack);
  rpc ReportWakeup(WakeupProto) returns (Ack);
  rpc ReportSleep(SleepProto) returns (Ack);

  // TemporalLayer → Cortex
  rpc ReportTemporalHeartbeat(TemporalHeartbeatProto) returns (Ack);
  rpc ReportTemporalAnomalySignal(TemporalAnomalySignalProto) returns (Ack);
}

message ProcessedEventProto {
  string agent_name = 1;
  string correlation_id = 2;
  int64 input_received_at_ms = 3;
  int64 output_sent_at_ms = 4;
  float processing_latency_ms = 5;
  float anomaly_score = 6;
  bool is_anomaly = 7;
  string anomaly_type = 8;
  string payload_schema_hash = 9;
  int32 input_size_bytes = 10;
  int32 output_size_bytes = 11;
  string source_phase = 12;
}

message HeartbeatProto {
  string agent_name = 1;
  int64 timestamp_ms = 2;
  float message_rate_per_sec = 3;
  float error_rate_last_window = 4;
  int64 last_message_timestamp_ms = 5;
  string model_phase = 6;
}

message TemporalHeartbeatProto {
  string layer_name              = 1;
  int64  timestamp_ms            = 2;
  int64  window_start_ms         = 3;
  int64  window_end_ms           = 4;
  repeated string agents_monitored = 5;
  int32  total_events_in_window  = 6;
  float  anomaly_rate            = 7;
  float  avg_score               = 8;
  float  avg_latency_ms          = 9;
  int32  bucket_confidence       = 10;
  string model_phase             = 11;
}

message TemporalAnomalyFlagsProto {
  bool is_rate_anomaly       = 1;
  bool is_volume_anomaly     = 2;
  bool is_score_anomaly      = 3;
  bool is_latency_anomaly    = 4;
  bool is_throughput_anomaly = 5;
}

message TemporalAnomalySignalProto {
  string layer_name      = 1;
  int64  window_start_ms = 2;
  int64  window_end_ms   = 3;
  int32  hour_of_week    = 4;

  float  anomaly_rate    = 5;
  float  anomaly_rate_z  = 6;
  int32  volume          = 7;
  float  volume_z        = 8;
  float  avg_score_z     = 9;
  float  avg_latency_z        = 10;
  float  events_per_second    = 14;
  float  events_per_second_z  = 15;

  TemporalAnomalyFlagsProto flags = 11;

  repeated string contributing_agents = 12;
  int32  bucket_confidence            = 13;
}

message WakeupProto {
  string source_name  = 1;
  string source_type  = 2;
  string source_phase = 3;
  int64  timestamp_ms = 4;
}

message SleepProto {
  string source_name  = 1;
  string source_type  = 2;
  string source_phase = 3;
  int64  timestamp_ms = 4;
}

message Ack {
  bool ok = 1;
}
