[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel"
version = "0.1.0"
description = "Anomaly detection library for event-driven architectures"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "structlog>=24.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "aiobotocore>=2.12",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
engine = [
    "redis>=5.0",
    "protobuf>=4.25",
]
agent = [
    "redis>=5.0",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "numpy>=1.26",
    "joblib>=1.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-docker>=3.0",
    "pytest-cov>=5.0",
]

[project.scripts]
sentinel = "sentinel.runtime.cli:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]
